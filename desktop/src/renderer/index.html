<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: vera-bg: https://avatars.githubusercontent.com https://raw.githubusercontent.com; frame-src http://127.0.0.1:*; font-src 'self' data:; media-src 'self' data:"

    <link rel="icon" type="image/png" href="/src/assets/splash/vera-logo.png" />

    <link rel="stylesheet" href="/src/styles/splash.css" />
    <link rel="preload" as="image" href="/src/assets/splash/vera-logo.png" />
    <link rel="preload" as="image" href="/src/assets/splash/dot-light.png" />
    <link rel="preload" as="image" href="/src/assets/splash/wave-light.png" />
    <link rel="preload" as="image" href="/src/assets/splash/wave-dark.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/bootstrap-theme.ts"></script>
    <script type="module" src="/src/splash-dom.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
