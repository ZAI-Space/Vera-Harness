<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>03 - 端到端的流程</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Quantico:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* Continuous flowing light bar animation */
    @keyframes streamFlow {
      0% {
        background-position: 100% 0;
      }
      100% {
        background-position: -100% 0;
      }
    }
    .flowing-light-bar {
      background: linear-gradient(90deg,
        #00D2FF 0%,
        #1677FF 25%,
        #93C5FD 50%,
        #1677FF 75%,
        #00D2FF 100%
      );
      background-size: 200% 100%;
      animation: streamFlow 2.5s linear infinite;
    }
  </style>
</head>
<body class="bg-white m-0 p-0 flex justify-center">

  <!-- 03 WORKFLOW SECTION -->
  <section id="workflow" class="w-full max-w-[1040px] flex flex-col items-center py-6 bg-white">
    <div class="text-center mb-8">
      <h2 id="wf-title" class="font-quantico text-3xl sm:text-4xl font-bold tracking-tight text-gray-900">
        把任务、智能体和进度放在一起看
      </h2>
      <!-- 3x Width Flowing Light Bar -->
      <div class="w-64 h-1.5 flowing-light-bar mx-auto mt-4 rounded-full"></div>
    </div>

    <!-- 6 Steps Card Grid -->
    <div class="w-full bg-white rounded-3xl border border-gray-200/90 shadow-[0_12px_36px_rgba(15,23,42,0.06)] p-6 sm:p-10">
      <div class="grid grid-cols-1 md:grid-cols-3 divide-y md:divide-y-0 md:divide-x divide-gray-100">

        <!-- 01 -->
        <div class="p-6 flex flex-col justify-between hover:bg-slate-50/60 rounded-xl transition-colors">
          <div>
            <div class="flex items-center justify-between mb-6">
              <div class="w-10 h-10 rounded-xl bg-gray-50 border border-gray-100 flex items-center justify-center text-gray-700">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
              </div>
              <span class="font-mono-code text-xs font-semibold text-gray-300 border border-gray-200 px-2 py-0.5 rounded">01</span>
            </div>
            <h3 id="wf-card1-title" class="text-lg font-bold text-gray-900 mb-2">接收任务</h3>
            <p id="wf-card1-desc" class="text-xs sm:text-sm text-gray-500 leading-relaxed">选择项目、模型与执行模式，提交一次可追踪的任务</p>
          </div>
        </div>

        <!-- 02 -->
        <div class="p-6 flex flex-col justify-between hover:bg-slate-50/60 rounded-xl transition-colors">
          <div>
            <div class="flex items-center justify-between mb-6">
              <div class="w-10 h-10 rounded-xl bg-gray-50 border border-gray-100 flex items-center justify-center text-gray-700">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
              </div>
              <span class="font-mono-code text-xs font-semibold text-gray-300 border border-gray-200 px-2 py-0.5 rounded">02</span>
            </div>
            <h3 id="wf-card2-title" class="text-lg font-bold text-gray-900 mb-2">准备上下文</h3>
            <p id="wf-card2-desc" class="text-xs sm:text-sm text-gray-500 leading-relaxed">汇集项目文件、会话历史和相关记忆，形成任务上下文</p>
          </div>
        </div>

        <!-- 03 -->
        <div class="p-6 flex flex-col justify-between hover:bg-slate-50/60 rounded-xl transition-colors">
          <div>
            <div class="flex items-center justify-between mb-6">
              <div class="w-10 h-10 rounded-xl bg-gray-50 border border-gray-100 flex items-center justify-center text-gray-700">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
              </div>
              <span class="font-mono-code text-xs font-semibold text-gray-300 border border-gray-200 px-2 py-0.5 rounded">03</span>
            </div>
            <h3 id="wf-card3-title" class="text-lg font-bold text-gray-900 mb-2">组装智能体</h3>
            <p id="wf-card3-desc" class="text-xs sm:text-sm text-gray-500 leading-relaxed">按任务加载模型、工具、Skills、MCP 和 Subagent</p>
          </div>
        </div>

      </div>

      <div class="border-t border-gray-100 my-2 hidden md:block"></div>

      <div class="grid grid-cols-1 md:grid-cols-3 divide-y md:divide-y-0 md:divide-x divide-gray-100">

        <!-- 04 -->
        <div class="p-6 flex flex-col justify-between hover:bg-slate-50/60 rounded-xl transition-colors">
          <div>
            <div class="flex items-center justify-between mb-6">
              <div class="w-10 h-10 rounded-xl bg-gray-50 border border-gray-100 flex items-center justify-center text-gray-700">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
              </div>
              <span class="font-mono-code text-xs font-semibold text-gray-300 border border-gray-200 px-2 py-0.5 rounded">04</span>
            </div>
            <h3 id="wf-card4-title" class="text-lg font-bold text-gray-900 mb-2">执行与确认</h3>
            <p id="wf-card4-desc" class="text-xs sm:text-sm text-gray-500 leading-relaxed">在选定环境中调用工具，按权限模式请求确认或继续执行</p>
          </div>
        </div>

        <!-- 05 -->
        <div class="p-6 flex flex-col justify-between hover:bg-slate-50/60 rounded-xl transition-colors">
          <div>
            <div class="flex items-center justify-between mb-6">
              <div class="w-10 h-10 rounded-xl bg-gray-50 border border-gray-100 flex items-center justify-center text-gray-700">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
              </div>
              <span class="font-mono-code text-xs font-semibold text-gray-300 border border-gray-200 px-2 py-0.5 rounded">05</span>
            </div>
            <h3 id="wf-card5-title" class="text-lg font-bold text-gray-900 mb-2">反馈与推进</h3>
            <p id="wf-card5-desc" class="text-xs sm:text-sm text-gray-500 leading-relaxed">持续展示正文、思考和工具进度，将执行结果反馈给模型</p>
          </div>
        </div>

        <!-- 06 -->
        <div class="p-6 flex flex-col justify-between hover:bg-slate-50/60 rounded-xl transition-colors">
          <div>
            <div class="flex items-center justify-between mb-6">
              <div class="w-10 h-10 rounded-xl bg-gray-50 border border-gray-100 flex items-center justify-center text-gray-700">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><circle cx="10" cy="13" r="2"/><path d="M10 15v3"/></svg>
              </div>
              <span class="font-mono-code text-xs font-semibold text-gray-300 border border-gray-200 px-2 py-0.5 rounded">06</span>
            </div>
            <h3 id="wf-card6-title" class="text-lg font-bold text-gray-900 mb-2">交付与记录</h3>
            <p id="wf-card6-desc" class="text-xs sm:text-sm text-gray-500 leading-relaxed">汇总结果、文件变化、验证信息和运行记录，支持后续核查</p>
          </div>
        </div>

      </div>
    </div>
  </section>

</body>
</html>
