<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>01 - 首页 HERO</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Quantico:wght@700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-white">

  <!-- 01 HERO BODY CONTENT -->
  <section id="hero" class="relative min-h-[78vh] flex flex-col justify-start items-center text-center px-4 sm:px-8 pt-8 sm:pt-12 pb-14 bg-white">

    <!-- Main Title: VERA HARNESS (At upper third position) -->
    <h1 class="font-quantico text-5xl sm:text-7xl md:text-8xl font-extrabold tracking-tight text-gray-900 uppercase mb-4 leading-none select-none">
      VERA HARNESS
    </h1>

    <!-- Chinese / English Tagline with Gradient Accent -->
    <div class="text-3xl sm:text-5xl font-extrabold text-gray-900 mb-8 tracking-wide flex items-center justify-center gap-3 sm:gap-4 flex-wrap select-none">
      <span>做你所想</span>
      <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#00D2FF] to-[#1677FF]">如你所愿</span>
    </div>

    <!-- Subtitle Descriptions (Unified Typography Size & Line Height) -->
    <p class="max-w-2xl text-[15px] sm:text-base text-gray-600 leading-relaxed font-normal mb-1.5">
      无论是日常工作流、构建专业级代码，还是搭建自己的 AGENT，一切皆始于此
    </p>
    <p class="max-w-2xl text-[15px] sm:text-base text-gray-600 leading-relaxed font-normal mb-10">
      VERA Harness 让模型、工具、记忆与子代理按需组合，打造属于自己的工作方式
    </p>

    <!-- CTA Dual Buttons -->
    <div class="flex items-center justify-center gap-4 flex-wrap">
      <a href="https://github.com/ZAI-Space/Vera-Harness" target="_blank" rel="noopener noreferrer" class="btn-glass-dark text-white font-semibold text-sm sm:text-base px-7 py-3 rounded-full inline-flex items-center gap-2.5">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"></path>
        </svg>
        <span>查看 GitHub</span>
      </a>
      <a id="btn-hero-quickstart" href="#quickstart" class="btn-glass-light text-gray-900 font-semibold text-sm sm:text-base px-7 py-3 rounded-full inline-flex items-center group cursor-pointer">
        <span>快速开始</span>
        <svg class="w-4 h-4 ml-2 transition-transform group-hover:translate-x-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>
    </div>
  </section>

  <!-- Interactive Scripts: Smooth Scroll -->
  <script>
    const quickstartBtn = document.getElementById('btn-hero-quickstart');
    if (quickstartBtn) {
      quickstartBtn.addEventListener('click', (e) => {
        e.preventDefault();
        try {
          if (window.parent && window.parent.document) {
            const target = window.parent.document.getElementById('sec-07');
            if (target) {
              target.scrollIntoView({ behavior: 'smooth' });
              return;
            }
          }
        } catch (err) {}
        window.location.hash = '#quickstart';
      });
    }
  </script>

</body>
</html>
