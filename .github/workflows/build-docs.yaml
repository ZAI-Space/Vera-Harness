name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: python -m pip install -e '.[full,channels]'
      - name: Build documentation strictly without deploying
        run: |
          python scripts/check_docs.py
          python -m mkdocs build --strict
          python -m mkdocs build --strict --config-file mkdocs.website.yml --site-dir "$RUNNER_TEMP/vera-website-docs"
