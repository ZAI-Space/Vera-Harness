name: Quality and build

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build and lint dependencies
        run: python -m pip install -e '.[full,channels]' build twine
      - name: Check all source and test formatting
        run: python -m ruff format --check src tests
      - name: Lint all source and tests
        run: python -m ruff check src tests
      - name: Check shell launcher syntax
        run: bash -n scripts/start.sh
      - name: Build and check wheel and source distribution
        run: |
          python -m build
          python -m twine check dist/*
      - name: Smoke test the installed wheel
        run: |
          python -m venv /tmp/vera-wheel
          /tmp/vera-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/vera-wheel/bin/mini --help
          /tmp/vera-wheel/bin/mini-extra --help
          /tmp/vera-wheel/bin/mini-extra channels --help
          /tmp/vera-wheel/bin/mini-extra plugins --help
          /tmp/vera-wheel/bin/mini-extra cron --help
      - name: Preserve installable packages
        uses: actions/upload-artifact@v6
        with:
          name: python-packages
          path: dist/*
