name: Desktop integration

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      VERA_SILENT_STARTUP: '1'
      PYTHONUTF8: '1'
      VERA_PYTHON: python
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python runtime for the real worker contract test
        run: python -m pip install -e '..[full,channels]'
      - name: Install locked desktop dependencies
        run: npm ci
      - name: Validate execution boundary
        run: npm run check:boundary
      - name: Check formatting and lint
        run: npm run lint
      - name: Check TypeScript contracts
        run: npm run typecheck
      - name: Run frontend and Python-worker integration tests
        run: npm test
      - name: Build Electron frontend
        run: npm run build
      - name: Check emitted font assets
        run: node tests/ui/font-assets.mjs
      - name: Prepare pinned optional Taskboard for acceptance
        shell: bash
        env:
          VERA_TASKBOARD_HOME: ${{ runner.temp }}/vera-taskboard
        run: |
          printf 'VERA_TASKBOARD_HOME=%s\n' "$VERA_TASKBOARD_HOME" >> "$GITHUB_ENV"
          git clone --no-checkout https://github.com/chuspeeism/dashi-taskboard.git "$VERA_TASKBOARD_HOME"
          git -C "$VERA_TASKBOARD_HOME" checkout --detach bc25451c5c49a14abb6c4e8250b62c626b007f8a
          cd "$VERA_TASKBOARD_HOME"
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/vite/bin/vite.js build --config web/vite.config.ts
      - name: Exercise actual Electron settings on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:ui
      - name: Exercise actual Electron settings on Windows
        if: runner.os == 'Windows'
        run: npm run test:ui
