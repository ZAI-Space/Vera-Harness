name: Release artifacts

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build release artifacts
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit released from main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop run build
      - run: python scripts/build_desktop_package.py
      - run: npm pack ./dist/npm --pack-destination ./dist
      - name: Check artifacts and checksums
        run: |
          python -m twine check dist/npm/python/*.whl
          cp dist/npm/python/*.whl dist/
          cd dist
          sha256sum ./*.tgz ./*.whl > SHA256SUMS.txt
      - uses: actions/upload-artifact@v6
        with:
          name: release-packages
          path: |
            dist/*.tgz
            dist/*.whl
            dist/SHA256SUMS.txt
      - name: Attach artifacts to the published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.tgz dist/*.whl dist/SHA256SUMS.txt --clobber
