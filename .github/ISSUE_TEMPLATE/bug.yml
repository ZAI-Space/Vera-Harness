name: Bug Report
description: Create a report to help us reproduce and correct the bug
labels: ['bug']

body:
- type: textarea
  attributes:
    label: Describe the bug
    description: >
      A clear and concise description of what the bug is.
      Include a minimal reproduction and the relevant error message.
      Any hint about how to reproduce your issue will help us help you!
      Please also include your operating system where relevant.
      Markdown formatting is appreciated 😉

      VERA run records can contain source code, prompts and credentials.
      Share only the smallest relevant excerpt after removing sensitive values.
  validations:
    required: true
- type: markdown
  attributes:
    value: >
      Thanks for contributing 🎉!
